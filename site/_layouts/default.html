<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="icon" type="image/png" href="{{ '/images/icon.png' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Inter:wght@400;600;700&display=swap">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="bar">
  <a class="brand" href="{{ '/' | relative_url }}">
    <img src="{{ '/images/icon.png' | relative_url }}" alt="" width="28" height="28">Copy Comments
  </a>
  <nav aria-label="Site">
    <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Guide</a>
    <a href="{{ '/privacy/' | relative_url }}"{% if page.url == '/privacy/' %} aria-current="page"{% endif %}>Privacy</a>
    <a href="https://github.com/{{ site.repository }}/issues">Support</a>
  </nav>
</header>
<main id="main" class="{{ page.class | default: 'doc' }}">
{{ content }}
</main>
<footer>
  <p>Copy Comments is an independent plugin. It isn’t made, endorsed, or supported by Figma.</p>
  <p><a href="https://github.com/{{ site.repository }}/issues">Get help or report a problem</a> · <a href="{{ '/privacy/' | relative_url }}">Privacy policy</a> · <a href="https://github.com/{{ site.repository }}">Source code</a></p>
</footer>
</body>
</html>
